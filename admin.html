<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Portfolio Board Admin</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      rel="stylesheet"
      as="style"
      crossorigin
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css"
    />
    <style>
      body {
        font-family: "Pretendard", sans-serif;
      }
    </style>
  </head>
  <body class="bg-zinc-950 text-white min-h-screen">
    <main class="max-w-4xl mx-auto px-6 py-16">
      <h1 class="text-3xl font-black mb-2">Board Admin</h1>
      <p class="text-sm text-zinc-400 mb-10">
        이 페이지는 게시글 작성 전용입니다. <code>index.html</code>에서는 접근
        경로를 제공하지 않습니다.
      </p>

      <section class="rounded-2xl border border-white/10 bg-white/5 p-6 mb-8">
        <h2 class="text-xl font-bold mb-4">새 글 작성</h2>
        <form id="post-form" class="space-y-4">
          <div>
            <label for="board-type" class="block text-sm text-zinc-300 mb-2"
              >게시판</label
            >
            <select
              id="board-type"
              class="w-full bg-zinc-900 border border-white/10 rounded-lg px-4 py-3"
            >
              <option value="newsroom">My Newsroom</option>
              <option value="opinion">My Opinion</option>
            </select>
          </div>

          <div>
            <label for="post-title" class="block text-sm text-zinc-300 mb-2"
              >제목</label
            >
            <input
              id="post-title"
              class="w-full bg-zinc-900 border border-white/10 rounded-lg px-4 py-3"
              maxlength="120"
              required
            />
          </div>

          <div>
            <label for="post-content" class="block text-sm text-zinc-300 mb-2"
              >내용</label
            >
            <textarea
              id="post-content"
              class="w-full bg-zinc-900 border border-white/10 rounded-lg px-4 py-3 min-h-40"
              required
            ></textarea>
          </div>

          <button
            type="submit"
            class="px-5 py-3 rounded-lg bg-blue-600 hover:bg-blue-500 transition-colors font-bold"
          >
            게시글 저장
          </button>
        </form>
      </section>

      <section class="rounded-2xl border border-white/10 bg-white/5 p-6">
        <div class="flex items-center justify-between gap-4 mb-4">
          <h2 class="text-xl font-bold">저장된 글 관리</h2>
          <select
            id="filter-board"
            class="bg-zinc-900 border border-white/10 rounded-lg px-4 py-2"
          >
            <option value="newsroom">My Newsroom</option>
            <option value="opinion">My Opinion</option>
          </select>
        </div>
        <div id="admin-list" class="space-y-3"></div>
      </section>
    </main>

    <script>
      const ADMIN_PASSWORD = "ldg-portfolio-2026";
      const boardStorageKey = "portfolioBoards";

      const allowed = sessionStorage.getItem("portfolio-admin-ok") === "true";
      if (!allowed) {
        const input = window.prompt("관리자 비밀번호를 입력하세요");
        if (input !== ADMIN_PASSWORD) {
          document.body.innerHTML =
            '<div class="min-h-screen grid place-items-center text-zinc-300">접근 권한이 없습니다.</div>';
          throw new Error("Unauthorized");
        }
        sessionStorage.setItem("portfolio-admin-ok", "true");
      }

      const getBoardData = () => {
        try {
          const parsed = JSON.parse(localStorage.getItem(boardStorageKey) || "[]");
          return Array.isArray(parsed) ? parsed : [];
        } catch {
          return [];
        }
      };

      const saveBoardData = (data) => {
        localStorage.setItem(boardStorageKey, JSON.stringify(data));
      };

      const formatDateTime = (iso) =>
        new Date(iso).toLocaleString("ko-KR", {
          year: "numeric",
          month: "2-digit",
          day: "2-digit",
          hour: "2-digit",
          minute: "2-digit",
        });

      const renderAdminList = () => {
        const filter = document.getElementById("filter-board").value;
        const list = document.getElementById("admin-list");
        const data = getBoardData();
        const posts = data
          .filter((p) => p.board === filter)
          .sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt));

        if (!posts.length) {
          list.innerHTML =
            '<p class="text-sm text-zinc-400 border border-dashed border-white/10 rounded-lg p-4">등록된 글이 없습니다.</p>';
          return;
        }

        list.innerHTML = posts
          .map(
            (post) => `
            <article class="border border-white/10 rounded-lg p-4 bg-zinc-900/40">
              <div class="flex items-start justify-between gap-4">
                <div>
                  <h3 class="font-bold text-white">${post.title}</h3>
                  <p class="text-xs text-zinc-500 mt-1">${formatDateTime(post.createdAt)}</p>
                </div>
                <button
                  class="delete-btn text-xs px-3 py-2 rounded-md border border-red-400/30 text-red-300 hover:bg-red-500/10"
                  data-id="${post.id}"
                  data-board="${filter}"
                >
                  삭제
                </button>
              </div>
            </article>
          `,
          )
          .join("");

        document.querySelectorAll(".delete-btn").forEach((button) => {
          button.addEventListener("click", () => {
            const id = button.dataset.id;
            saveBoardData(getBoardData().filter((item) => item.id !== id));
            renderAdminList();
          });
        });
      };

      document
        .getElementById("post-form")
        .addEventListener("submit", (event) => {
          event.preventDefault();

          const board = document.getElementById("board-type").value;
          const title = document.getElementById("post-title").value.trim();
          const content = document.getElementById("post-content").value.trim();

          if (!title || !content) {
            return;
          }

          const data = getBoardData();
          data.push({
            id: `${Date.now()}-${Math.random().toString(16).slice(2)}`,
            board,
            title,
            content,
            createdAt: new Date().toISOString(),
          });
          saveBoardData(data);

          document.getElementById("post-form").reset();
          document.getElementById("board-type").value = board;
          document.getElementById("filter-board").value = board;
          renderAdminList();
        });

      document
        .getElementById("filter-board")
        .addEventListener("change", renderAdminList);
      renderAdminList();
    </script>
  </body>
</html>
